<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES Classroom Visit Opportunities — International School Nido de Aguilas</title>
  <!-- Load Google Font Raleway (weights 600, 700, 800) for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       DESIGN TOKENS & VERSION 1 PALETTE
       ========================================================================== */
    :root {
      --font-head: 'Raleway', sans-serif;
      --font-body: 'Avenir Next', 'Avenir', 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      --bg-page: #fcfaf8;
      --bg-surface: #ffffff;
      --border-hairline: #e3d9ce;
      --border-soft: #e6ddd3;

      --track-tab: #f1e9e0;
      --pill-bg: #f5f1ec;
      --pill-hover: #ece5dc;

      --navy-primary: #202a3c;
      --green-no-students: #006f4f;
      --slate-with-students: #205176;
      --other-block: #f2ede4;
      --meeting-bg: #fef3c7;
      --meeting-border: #dfb94c;
      --meeting-text: #202a3c;
      --meeting-subtext: #7c5800;

      --text-main: #202a3c;
      --text-muted: #5d6574;
      --text-subtle: #7c828e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ==========================================================================
       TOP HEADER & BRAND LOCKUP
       ========================================================================== */
    .app-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .brand-logo {
      height: 56px;
      width: auto;
      display: block;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.32rem;
      color: var(--navy-primary);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-text p {
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Segmented Mode Switcher */
    .mode-switcher {
      background-color: var(--track-tab);
      padding: 4px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border-hairline);
      flex-wrap: nowrap;
    }

    .mode-btn {
      font-family: var(--font-body);
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--navy-primary);
      background: transparent;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
      white-space: nowrap;
    }

    .mode-btn:hover:not(.active) {
      background-color: rgba(255, 255, 255, 0.55);
    }

    .mode-btn.active {
      background-color: var(--navy-primary);
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(32, 42, 60, 0.18);
    }

    /* ==========================================================================
       MAIN CONTAINER & CARDS
       ========================================================================== */
    .main-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: 0 1px 3px rgba(32, 42, 60, 0.03);
    }

    /* Filter Sections */
    .filter-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .filter-section + .filter-section {
      padding-top: 16px;
      border-top: 1px solid var(--border-soft);
    }

    .section-label {
      font-family: var(--font-head);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Standard Filter Pills */
    .pill {
      font-family: var(--font-body);
      font-size: 0.86rem;
      font-weight: 600;
      background-color: var(--pill-bg);
      color: var(--navy-primary);
      border: 1px solid var(--border-hairline);
      border-radius: 999px;
      padding: 7px 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .pill:hover:not(.active) {
      background-color: var(--pill-hover);
    }

    .pill.active {
      background-color: var(--navy-primary);
      color: #ffffff;
      border-color: var(--navy-primary);
    }

    /* Day Pill with inline 'only' trigger */
    .day-pill {
      padding-right: 8px;
    }

    .only-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: lowercase;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(32, 42, 60, 0.18);
      background-color: rgba(255, 255, 255, 0.7);
      color: var(--navy-primary);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .day-pill.active .only-btn {
      background-color: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }

    .only-btn:hover {
      background-color: #ffffff;
      color: var(--navy-primary);
    }

    /* Compare Against Pills with Status Dot */
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-no-students {
      background-color: var(--green-no-students);
    }

    .dot-with-students {
      background-color: var(--slate-with-students);
    }

    .pill.compare-pill.active.type-no-students {
      background-color: var(--green-no-students);
      border-color: var(--green-no-students);
      color: #ffffff;
    }

    .pill.compare-pill.active.type-with-students {
      background-color: var(--slate-with-students);
      border-color: var(--slate-with-students);
      color: #ffffff;
    }

    .pill.compare-pill.active .status-dot {
      background-color: #ffffff;
    }

    /* Quick Presets Row */
    .presets-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .presets-label {
      font-family: var(--font-head);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
      margin-right: 2px;
    }

    .preset-btn {
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-surface);
      color: var(--navy-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .preset-btn:hover {
      background-color: var(--pill-bg);
      border-color: #cfc2b4;
    }

    /* Manual Time Inputs (Mode 2) */
    .time-inputs-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .time-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .time-field label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .time-input {
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--navy-primary);
      background-color: var(--pill-bg);
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
      padding: 8px 13px;
      width: 145px;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .time-input:focus {
      background-color: #ffffff;
      border-color: var(--navy-primary);
    }

    .time-error {
      font-size: 0.82rem;
      font-weight: 600;
      color: #b42318;
      background-color: #fef3f2;
      border: 1px solid #fecdca;
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* ==========================================================================
       RESULTS & TIMELINE VISUALIZATION
       ========================================================================== */
    .results-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .result-title {
      font-family: var(--font-head);
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--navy-primary);
    }

    .result-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .avail-badge {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background-color: #e7f4ef;
      color: var(--green-no-students);
      border: 1px solid rgba(0, 111, 79, 0.2);
    }

    .avail-badge.zero {
      background-color: var(--pill-bg);
      color: var(--text-muted);
      border-color: var(--border-hairline);
    }

    .copy-btn {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      background-color: var(--bg-surface);
      color: var(--navy-primary);
      border: 1px solid var(--border-hairline);
      border-radius: 9px;
      padding: 6px 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background-color: var(--pill-bg);
      border-color: #cfc2b4;
    }

    .copy-btn.copied {
      background-color: var(--navy-primary);
      color: #ffffff;
      border-color: var(--navy-primary);
    }

    /* Timeline Subheader & Legend */
    .timeline-subheader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      margin-bottom: 10px;
    }

    .timeline-caption {
      font-family: var(--font-head);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .legend-list {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      border: 1px solid rgba(32, 42, 60, 0.12);
      flex-shrink: 0;
    }

    /* Horizontal Scroll Container for Responsive Safety */
    .timeline-scroll {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .timeline-board {
      min-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Axis Header */
    .timeline-axis-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: end;
      gap: 12px;
      padding-bottom: 4px;
    }

    .axis-track {
      position: relative;
      height: 20px;
    }

    .axis-tick {
      position: absolute;
      transform: translateX(-50%);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-subtle);
      white-space: nowrap;
    }

    .axis-tick:first-child {
      transform: translateX(0);
    }

    .axis-tick:last-child {
      transform: translateX(-100%);
    }

    /* Grade Track Rows */
    .timeline-rows-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .grade-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      gap: 12px;
    }

    .grade-row.target-row {
      padding-bottom: 7px;
      margin-bottom: 2px;
      border-bottom: 1px dashed var(--border-hairline);
    }

    .grade-label {
      font-family: var(--font-head);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy-primary);
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .grade-label span.role-tag {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-subtle);
      margin-top: 2px;
    }

    .track-lane {
      position: relative;
      height: 52px;
      background-color: #faf7f3;
      border: 1px solid var(--border-soft);
      border-radius: 9px;
      overflow: hidden;
    }

    /* Subtle Vertical Grid Lines & Target Highlight Window */
    .grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: rgba(227, 217, 206, 0.55);
      pointer-events: none;
      z-index: 1;
    }

    .target-window-guide {
      position: absolute;
      top: 0;
      bottom: 0;
      background-color: rgba(153, 27, 27, 0.04);
      border-left: 2.5px dashed #991b1b;
      border-right: 2.5px dashed #991b1b;
      pointer-events: none;
      z-index: 4;
    }

    /* Individual Schedule Block Segments */
    .sched-block {
      position: absolute;
      top: 3px;
      bottom: 3px;
      border-radius: 6px;
      padding: 2px 5px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      z-index: 3;
      cursor: default;
      transition: filter 0.12s ease, transform 0.12s ease;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .sched-block:hover {
      filter: brightness(0.96);
      z-index: 5;
    }

    .sched-block.is-target {
      background-color: var(--navy-primary);
      color: #ffffff;
      border-color: var(--navy-primary);
    }

    .sched-block.is-match-no-students {
      background-color: var(--green-no-students);
      color: #ffffff;
      border-color: var(--green-no-students);
    }

    .sched-block.is-match-with-students {
      background-color: var(--slate-with-students);
      color: #ffffff;
      border-color: var(--slate-with-students);
    }

    .sched-block.is-other {
      background-color: var(--other-block);
      color: #4f5765;
      border-color: #e3dbd0;
    }

    .sched-block.is-meeting {
      background-color: var(--meeting-bg);
      color: var(--meeting-text);
      border-color: var(--meeting-border);
    }

    .block-name {
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }

    .block-meeting {
      font-size: 0.63rem;
      font-weight: 700;
      color: var(--meeting-subtext);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
      margin-top: 1px;
    }

    .sched-block.is-target .block-meeting {
      color: #fde68a;
    }

    .block-time {
      font-size: 0.62rem;
      font-weight: 500;
      opacity: 0.88;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
      margin-top: 1px;
    }

    /* Compact Matching Windows Summary List */
    .matches-summary {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .match-chip {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background-color: var(--pill-bg);
      border: 1px solid var(--border-hairline);
      color: var(--navy-primary);
    }

    .match-chip.has-meeting {
      border-color: var(--meeting-border);
    }

    .match-chip-meeting {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--meeting-subtext);
      background-color: var(--meeting-bg);
      border: 1px solid var(--meeting-border);
      border-radius: 5px;
      padding: 1px 7px;
      line-height: 1.25;
    }

    .match-chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .match-chip-meta {
      color: var(--text-muted);
      font-weight: 500;
    }

    .no-matches-note {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Day & Time Mode: Per-Grade Breakdown Boxes */
    .dt-grade-grid {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border-soft);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .dt-grade-card {
      background-color: var(--bg-surface);
      border: 1.25px solid var(--border-hairline);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
    }

    .dt-grade-card.has-no-students {
      border-color: rgba(0, 111, 79, 0.34);
    }

    .dt-grade-card.has-with-students {
      border-color: rgba(32, 81, 118, 0.34);
    }

    .dt-grade-card.has-meeting {
      border-color: var(--meeting-border);
    }

    .dt-grade-card-header {
      font-family: var(--font-head);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--navy-primary);
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
    }

    .dt-grade-block-list {
      display: flex;
      flex-direction: column;
    }

    .dt-grade-block-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 10px;
    }

    .dt-grade-block-item + .dt-grade-block-item {
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid var(--border-soft);
    }

    .dt-block-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dt-block-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--navy-primary);
      line-height: 1.25;
    }

    .dt-meeting-note {
      display: inline-block;
      width: fit-content;
      max-width: 100%;
      font-size: 0.73rem;
      font-weight: 700;
      color: var(--meeting-subtext);
      background-color: var(--meeting-bg);
      border: 1px solid var(--meeting-border);
      border-radius: 6px;
      padding: 2px 8px;
      line-height: 1.25;
      margin: 2px 0;
    }

    .dt-block-meta {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .dt-status-pill {
      font-size: 0.73rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dt-status-pill.no-students {
      background-color: #e7f4ef;
      color: var(--green-no-students);
    }

    .dt-status-pill.with-students {
      background-color: #e8eff5;
      color: var(--slate-with-students);
    }

    @media (max-width: 980px) {
      .dt-grade-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .dt-grade-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================================================
       MASTER GRID VIEW (MODE 3)
       ========================================================================== */
    .mg-day-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sched-block.is-grid-no-students {
      background-color: var(--green-no-students);
      color: #ffffff;
      border-color: var(--green-no-students);
    }

    .sched-block.is-grid-with-students {
      background-color: var(--slate-with-students);
      color: #ffffff;
      border-color: var(--slate-with-students);
    }

    /* ==========================================================================
       FLOATING TOOLTIP & TOAST
       ========================================================================== */
    .floating-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      background-color: var(--navy-primary);
      color: #ffffff;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 0.8rem;
      line-height: 1.4;
      box-shadow: 0 8px 22px rgba(32, 42, 60, 0.25);
      max-width: 280px;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .floating-tooltip.visible {
      opacity: 1;
    }

    .tooltip-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }

    .tooltip-sub {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.77rem;
    }

    .tooltip-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      background-color: rgba(255, 255, 255, 0.16);
    }

    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--navy-primary);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(32, 42, 60, 0.22);
      z-index: 110;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast-banner.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .header-inner {
        padding: 12px 16px;
      }
      .brand-logo {
        height: 46px;
      }
      .brand-text h1 {
        font-size: 1.12rem;
      }
      .main-container {
        padding: 16px;
      }
      .card {
        padding: 16px;
      }
      /* Mobile mode pills handled in dedicated mobile/touch block below */
      .timeline-scroll {
        -webkit-overflow-scrolling: touch;
      }
      .timeline-axis-row,
      .grade-row {
        grid-template-columns: 84px 1fr;
        gap: 0;
      }
      .timeline-axis-row > div:first-child {
        position: sticky;
        left: 0;
        z-index: 6;
        background-color: var(--bg-surface);
        align-self: stretch;
      }
      .grade-label {
        position: sticky;
        left: 0;
        z-index: 6;
        background-color: var(--bg-surface);
        align-self: stretch;
        justify-content: center;
        padding-right: 10px;
        font-size: 0.8rem;
        box-shadow: 4px 0 8px -5px rgba(32, 42, 60, 0.16);
      }
      .grade-label span.role-tag {
        font-size: 0.64rem;
      }
    }

    /* Mobile & Touch Devices: Render each view mode as an individual oval pill */
    @media (max-width: 960px), (hover: none) and (pointer: coarse) {
      .app-header .header-inner {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .app-header .mode-switcher {
        background: transparent;
        background-color: transparent;
        border: none;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        width: 100%;
      }
      .app-header .mode-btn {
        background-color: var(--pill-bg);
        color: var(--navy-primary);
        border: 1px solid var(--border-hairline);
        border-radius: 999px;
        padding: 7px 15px;
        font-size: 0.86rem;
        font-weight: 600;
        box-shadow: none;
      }
      .app-header .mode-btn:hover:not(.active) {
        background-color: var(--pill-hover);
      }
      .app-header .mode-btn.active {
        background-color: var(--navy-primary);
        border-color: var(--navy-primary);
        color: #ffffff;
        box-shadow: none;
      }
      /* Keep target window dotted red lines clearly visible above green, blue, and yellow blocks */
      .target-window-guide {
        background-color: rgba(220, 38, 38, 0.09);
        border-left: none;
        border-right: none;
        z-index: 10;
      }
      .target-window-guide::before,
      .target-window-guide::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        width: 3px;
        background: repeating-linear-gradient(
          to bottom,
          #dc2626 0 4px,
          rgba(255, 255, 255, 0.96) 4px 8px
        );
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.92);
        pointer-events: none;
      }
      .target-window-guide::before {
        left: -1.5px;
      }
      .target-window-guide::after {
        right: -1.5px;
      }
    }
  </style>
</head>

      { min: 450, label: '7:30' },
      { min: 510, label: '8:30' },
      { min: 570, label: '9:30' },
      { min: 630, label: '10:30' },
      { min: 690, label: '11:30' },
      { min: 750, label: '12:30' },
      { min: 810, label: '1:30' },
      { min: 885, label: '2:45' }
    ];

    const EXCLUDED_TARGET_BLOCKS = new Set(['HR Time', 'Dismissal', 'Arrival', 'Lunch', 'Recess']);

    const TARGET_BLOCK_ORDER = [
      'ELA',
      'Math',
      'Changemakers',
      'WINN',
      'Morning Meeting',
      'Spanish Morning Meeting',
      'Specials',
      'Spanish',
      'Break'
    ];

    const COMPARE_BLOCKS_META = [
      { name: 'Break', type: 'No Students' },
      { name: 'Specials', type: 'No Students' },
      { name: 'Spanish', type: 'No Students' },
      { name: 'Recess', type: 'No Students' },
      { name: 'Lunch', type: 'No Students' },
      { name: 'Math', type: 'With Students' },
      { name: 'ELA', type: 'With Students' },
      { name: 'WINN', type: 'With Students' },
      { name: 'Changemakers', type: 'With Students' },
      { name: 'Morning Meeting', type: 'With Students' },
      { name: 'Spanish Morning Meeting', type: 'With Students' },
      { name: 'HR Time', type: 'With Students' }
    ];

    const NO_STUDENTS_SET = new Set(['Break', 'Specials', 'Spanish', 'Recess', 'Lunch']);
    const WITH_STUDENTS_SET = new Set([
      'Math',
      'ELA',
      'WINN',
      'Changemakers',
      'Morning Meeting',
      'Spanish Morning Meeting',
      'HR Time'
    ]);

    const OVERLAP_OPTIONS = [1, 15, 30, 45];

    /**
     * Converts schedule string ("7:40", "1:10", "12:20") to minutes since midnight.
     * Hours < 7 are afternoon PM hours (+12).
     */
    function scheduleStrToMinutes(str) {
      const [hStr, mStr] = str.split(':');
      let h = parseInt(hStr, 10);
      const m = parseInt(mStr, 10);
      if (h < 7) h += 12;
      return h * 60 + m;
    }

    /**
     * Formats minutes since midnight into "h:mm AM/PM" (e.g., "10:25 AM").
     */
    function formatMinutes(totalMins) {
      const h24 = Math.floor(totalMins / 60);
      const m = totalMins % 60;
      const ampm = h24 >= 12 ? 'PM' : 'AM';
      const h12 = h24 > 12 ? h24 - 12 : h24 === 0 ? 12 : h24;
      return `${h12}:${String(m).padStart(2, '0')} ${ampm}`;
    }

    /**
     * Formats short time without AM/PM when space is tight on timeline blocks.
     */
    function formatShortTime(totalMins) {
      const h24 = Math.floor(totalMins / 60);
      const m = totalMins % 60;
      const h12 = h24 > 12 ? h24 - 12 : h24 === 0 ? 12 : h24;
      return `${h12}:${String(m).padStart(2, '0')}`;
    }

    /**
     * Parses user-entered time strings flexibly ("10:25", "10:25 AM", "1:15 PM", "13:15", etc.)
     * into minutes since midnight. Returns null if invalid.
     */
    function parseFlexibleTime(input) {
      if (!input || typeof input !== 'string') return null;
      const cleaned = input.trim().toLowerCase().replace(/\./g, '');
      const match = cleaned.match(/^(\d{1,2}):(\d{2})\s*(am|pm|a|p)?$/);
      if (!match) return null;

      let hours = parseInt(match[1], 10);
      const minutes = parseInt(match[2], 10);
      const meridiem = match[3] || '';

      if (minutes < 0 || minutes > 59 || hours < 1 || hours > 23) return null;

      if (meridiem.startsWith('p')) {
        if (hours < 12) hours += 12;
      } else if (meridiem.startsWith('a')) {
        if (hours === 12) hours = 0;
      } else {
        // School day heuristic when AM/PM omitted: 1..6 -> PM (13..18), 7..12 -> 7..12
        if (hours >= 1 && hours <= 6) hours += 12;
      }

      return hours * 60 + minutes;
    }

    // Pre-enrich schedule items with parsed start/end minutes
    const ENRICHED_SCHEDULE = SCHEDULE_DATA.map((item) => {
      const startMin = scheduleStrToMinutes(item.s);
      const endMin = scheduleStrToMinutes(item.e);
      return {
        ...item,
        startMin,
        endMin,
        duration: endMin - startMin
      };
    });

    /* ========================================================================
       3. APPLICATION STATE & LOCAL CLOCK DEFAULTS
       ======================================================================== */
    /**
     * Computes initial day and 1-hour time window defaults from the browser's
     * local clock, falling back cleanly outside school hours or on weekends.
     * At or after 2:45 PM on a weekday, defaults to 8:00 AM–9:00 AM the next school day.
     */
    function getInitialClockDefaults() {
      const now = new Date();
      const dayIndex = now.getDay(); // 0 = Sun, 1 = Mon ... 5 = Fri, 6 = Sat
      const isWeekday = dayIndex >= 1 && dayIndex <= 5;
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const isAfterSchool = isWeekday && currentMin >= DAY_END_MIN;

      const defaultDay = !isWeekday
        ? 'Monday'
        : isAfterSchool
          ? DAYS[dayIndex % 5]
          : DAYS[dayIndex - 1];

      const isSchoolHours = isWeekday && currentMin >= DAY_START_MIN && currentMin < DAY_END_MIN;

      const startMin = isSchoolHours ? currentMin : 480; // Fallback: 8:00 AM
      const endMin = isSchoolHours ? Math.min(currentMin + 60, DAY_END_MIN) : 540; // Fallback: 9:00 AM (1 hr)

      return {
        defaultDay,
        dtStartText: formatMinutes(startMin),
        dtEndText: formatMinutes(endMin)
      };
    }

    const INITIAL_DEFAULTS = getInitialClockDefaults();

    const state = {
      mode: 'daytime', // 'block' | 'daytime' | 'grid'

      // Mode 1: By Instructional Block
      selectedGrade: 1,
      targetBlocks: new Set(['ELA']),
      selectedDays: new Set(DAYS),
      compareAgainst: new Set(['Break', 'Specials', 'Spanish', 'Recess', 'Lunch']),
      minOverlap: 15,

      // Mode 2: By Day & Time
      dtDay: INITIAL_DEFAULTS.defaultDay,
      dtStartText: INITIAL_DEFAULTS.dtStartText,
      dtEndText: INITIAL_DEFAULTS.dtEndText,

      // Mode 3: Master Grid
      gridDay: INITIAL_DEFAULTS.defaultDay, // 'All' | 'Monday' | 'Tuesday' | 'Wednesday' | 'Thursday' | 'Friday'
      gridHighlight: 'all' // 'all' | 'no-students' | 'with-students' | 'meetings'
    };

    /* ========================================================================
       4. UTILITY FUNCTIONS (HTML ESCAPING, CLIPBOARD, TOOLTIPS, CALCULATIONS)
       ======================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(message) {
      const toast = document.getElementById('toastBanner');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    /**
     * Copies text using document.execCommand('copy') for full iFrame compatibility.
     */
    function copyTextToClipboard(text, btnEl) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        document.execCommand('copy');
        document.body.removeChild(textarea);

        if (btnEl) {
          const original = btnEl.innerHTML;
          btnEl.classList.add('copied');
          btnEl.textContent = 'Copied!';
          setTimeout(() => {
            btnEl.classList.remove('copied');
            btnEl.innerHTML = original;
          }, 1600);
        }
        showToast('Summary copied to clipboard');
      } catch (err) {
        showToast('Unable to copy summary');
      }
    }

    /**
     * Returns ordered distinct target subject blocks for a given grade,
     * strictly excluding HR Time, Dismissal, Arrival, Lunch, and Recess.
     */
    function getValidTargetBlocksForGrade(grade) {
      const present = new Set(
        ENRICHED_SCHEDULE
          .filter((item) => item.g === grade && !EXCLUDED_TARGET_BLOCKS.has(item.b))
          .map((item) => item.b)
      );
      const ordered = TARGET_BLOCK_ORDER.filter((b) => present.has(b));
      present.forEach((b) => {
        if (!ordered.includes(b)) ordered.push(b);
      });
      return ordered;
    }

    /**
     * Computes overlap in minutes between [aStart, aEnd] and [bStart, bEnd].
     */
    function getOverlapWindow(aStart, aEnd, bStart, bEnd) {
      const start = Math.max(aStart, bStart);
      const end = Math.min(aEnd, bEnd);
      const mins = end - start;
      return mins > 0 ? { start, end, mins } : null;
    }

    /**
     * Renders the 7:30 AM - 2:45 PM proportional time axis.
     */
    function renderTimelineAxis() {
      const ticksHtml = AXIS_TICKS.map((tick) => {
        const leftPct = ((tick.min - DAY_START_MIN) / DAY_SPAN_MIN) * 100;
        return `<span class="axis-tick" style="left: ${leftPct.toFixed(4)}%;">${tick.label}</span>`;
      }).join('');

      return `
        <div class="timeline-axis-row">
          <div></div>
          <div class="axis-track">${ticksHtml}</div>
        </div>
      `;
    }

    /**
     * Renders vertical gridlines inside a track lane.
     */
    function renderGridLines() {
      return AXIS_TICKS.slice(1, -1)
        .map((tick) => {
          const leftPct = ((tick.min - DAY_START_MIN) / DAY_SPAN_MIN) * 100;
          return `<div class="grid-line" style="left: ${leftPct.toFixed(4)}%;"></div>`;
        })
        .join('');
    }

    /**
     * Builds the HTML for a single block segment inside a grade track lane.
     */
    function renderBlockSegment(block, options) {
      const {
        visualClass,
        extraBadge = '',
        overlapInfo = null
      } = options;

      const clampedStart = Math.max(DAY_START_MIN, block.startMin);
      const clampedEnd = Math.min(DAY_END_MIN, block.endMin);
      if (clampedEnd <= clampedStart) return '';

      const leftPct = ((clampedStart - DAY_START_MIN) / DAY_SPAN_MIN) * 100;
      const widthPct = ((clampedEnd - clampedStart) / DAY_SPAN_MIN) * 100;

      const fullRange = `${formatMinutes(block.startMin)} – ${formatMinutes(block.endMin)}`;
      const shortRange = `${formatShortTime(block.startMin)}–${formatShortTime(block.endMin)}`;
      const showTimeLine = widthPct >= 7.5;
      const meetingLabel = block.m || '';

      const tooltipTitle = `Grade ${block.g} · ${block.b}${meetingLabel ? ` (${meetingLabel})` : ''}`;
      const tooltipSub = `${block.d} · ${fullRange} (${block.duration} min)${block.r !== block.b ? ` · ${block.r}` : ''}`;
      const tooltipBadge = overlapInfo
        ? `${overlapInfo.mins} min overlap (${formatMinutes(overlapInfo.start)} – ${formatMinutes(overlapInfo.end)})`
        : extraBadge || block.t;

      return `
        <div
          class="sched-block ${visualClass}"
          style="left: ${leftPct.toFixed(4)}%; width: ${widthPct.toFixed(4)}%;"
          data-tt-title="${escapeHtml(tooltipTitle)}"
          data-tt-sub="${escapeHtml(tooltipSub)}"
          data-tt-badge="${escapeHtml(tooltipBadge)}"
        >
          <div class="block-name">${escapeHtml(block.b)}</div>
          ${meetingLabel ? `<div class="block-meeting">${escapeHtml(meetingLabel)}</div>` : ''}
          ${showTimeLine ? `<div class="block-time">${escapeHtml(shortRange)}</div>` : ''}
        </div>
      `;
    }

    /* ========================================================================
       5. MODE 1: BY INSTRUCTIONAL BLOCK RENDERER
       ======================================================================== */
    function renderBlockMode() {
      const validTargets = getValidTargetBlocksForGrade(state.selectedGrade);
      state.targetBlocks = new Set(
        [...state.targetBlocks].filter((subj) => validTargets.includes(subj))
      );

      const allDaysSelected = state.selectedDays.size === DAYS.length;

      // Filter card HTML
      const filterCardHtml = `
        <section class="card" aria-label="Classroom visit filters">
          <div class="filter-grid">
            <!-- 1. GRADE LEVEL -->
            <div class="filter-section">
              <div class="section-label">1. GRADE LEVEL</div>
              <div class="pill-row">
                ${GRADES.map(
                  (g) => `
                    <button
                      type="button"
                      class="pill ${state.selectedGrade === g ? 'active' : ''}"
                      data-action="select-grade"
                      data-grade="${g}"
                    >
                      Grade ${g}
                    </button>
                  `
                ).join('')}
              </div>
            </div>

            <!-- 2. TARGET SUBJECT / BLOCK -->
            <div class="filter-section">
              <div class="section-label">2. TARGET SUBJECT / BLOCK</div>
              <div class="pill-row">
                ${validTargets
                  .map((subj) => {
                    const isActive = state.targetBlocks.has(subj);
                    return `
                      <button
                        type="button"
                        class="pill ${isActive ? 'active' : ''}"
                        aria-pressed="${isActive}"
                        data-action="select-target"
                        data-subject="${escapeHtml(subj)}"
                      >
                        ${escapeHtml(subj)}
                      </button>
                    `;
                  })
                  .join('')}
              </div>
              <div class="presets-row">
                <button type="button" class="preset-btn" data-action="target-unselect-all">
                  <span>Unselect all</span>
                </button>
              </div>
            </div>

            <!-- 3. DAYS OF THE WEEK -->
            <div class="filter-section">
              <div class="section-label">3. DAYS OF THE WEEK</div>
              <div class="pill-row">
                <button
                  type="button"
                  class="pill ${allDaysSelected ? 'active' : ''}"
                  data-action="select-all-days"
                >
                  All Days
                </button>
                ${DAYS.map((day) => {
                  const isActive = state.selectedDays.has(day);
                  return `
                    <div
                      role="button"
                      tabindex="0"
                      class="pill day-pill ${isActive ? 'active' : ''}"
                      data-action="toggle-day"
                      data-day="${day}"
                    >
                      <span>${day}</span>
                      <button
                        type="button"
                        class="only-btn"
                        data-action="only-day"
                        data-day="${day}"
                        aria-label="Select ${day} only"
                      >only</button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 4. COMPARE AGAINST -->
            <div class="filter-section">
              <div class="section-label">4. COMPARE AGAINST</div>
              <div class="pill-row">
                ${COMPARE_BLOCKS_META.map((item) => {
                  const isActive = state.compareAgainst.has(item.name);
                  const isNoStudents = item.type === 'No Students';
                  const typeClass = isNoStudents ? 'type-no-students' : 'type-with-students';
                  const dotClass = isNoStudents ? 'dot-no-students' : 'dot-with-students';
                  return `
                    <button
                      type="button"
                      class="pill compare-pill ${typeClass} ${isActive ? 'active' : ''}"
                      data-action="toggle-compare"
                      data-compare="${escapeHtml(item.name)}"
                    >
                      <span class="status-dot ${dotClass}"></span>
                      <span>${escapeHtml(item.name)}</span>
                    </button>
                  `;
                }).join('')}
              </div>
              <div class="presets-row">
                <span class="presets-label">QUICK PRESETS:</span>
                <button type="button" class="preset-btn" data-action="preset-compare" data-preset="no-students">
                  <span class="status-dot dot-no-students"></span>
                  <span>HR without Students</span>
                </button>
                <button type="button" class="preset-btn" data-action="preset-compare" data-preset="with-students">
                  <span class="status-dot dot-with-students"></span>
                  <span>HR with Students</span>
                </button>
                <button type="button" class="preset-btn" data-action="preset-compare" data-preset="unselect-all">
                  <span>Unselect all</span>
                </button>
              </div>
            </div>

            <!-- 5. MINIMUM OVERLAP WINDOW -->
            <div class="filter-section">
              <div class="section-label">5. MINIMUM OVERLAP WINDOW</div>
              <div class="pill-row">
                ${OVERLAP_OPTIONS.map(
                  (mins) => `
                    <button
                      type="button"
                      class="pill ${state.minOverlap === mins ? 'active' : ''}"
                      data-action="select-overlap"
                      data-overlap="${mins}"
                    >
                      ${mins}+ min
                    </button>
                  `
                ).join('')}
              </div>
            </div>
          </div>
        </section>
      `;

      // Find matching target occurrences across active days in Monday..Friday chronological order
      const occurrences = [];
      DAYS.forEach((day) => {
        if (!state.selectedDays.has(day)) return;
        const dayMatches = ENRICHED_SCHEDULE
          .filter((item) => item.g === state.selectedGrade && item.d === day && state.targetBlocks.has(item.b))
          .sort((a, b) => a.startMin - b.startMin);
        occurrences.push(...dayMatches);
      });

      const selectedTargetsLabel = [...state.targetBlocks].join(', ');
      const resultsHtml = state.targetBlocks.size === 0
        ? `<div class="card"><p class="no-matches-note">Select one or more options in Target Subject / Block above to view classroom visit opportunities.</p></div>`
        : occurrences.length
          ? occurrences.map((occ, idx) => renderOccurrenceCard(occ, idx)).join('')
          : `<div class="card"><p class="no-matches-note">No blocks found for Grade ${state.selectedGrade} · ${escapeHtml(selectedTargetsLabel)} on the selected day(s).</p></div>`;

      return `${filterCardHtml}<div class="results-stack">${resultsHtml}</div>`;
    }

    function renderOccurrenceCard(occ, idx) {
      const otherGrades = GRADES.filter((g) => g !== occ.g);
      const targetStart = occ.startMin;
      const targetEnd = occ.endMin;
      const guideLeft = ((targetStart - DAY_START_MIN) / DAY_SPAN_MIN) * 100;
      const guideWidth = ((targetEnd - targetStart) / DAY_SPAN_MIN) * 100;

      // Evaluate matching overlaps per other grade
      const matchingWindows = [];
      const availableGradesSet = new Set();

      otherGrades.forEach((g) => {
        const blocks = ENRICHED_SCHEDULE.filter((item) => item.g === g && item.d === occ.d);
        blocks.forEach((blk) => {
          if (!state.compareAgainst.has(blk.b)) return;
          const ov = getOverlapWindow(targetStart, targetEnd, blk.startMin, blk.endMin);
          if (ov && ov.mins >= state.minOverlap) {
            availableGradesSet.add(g);
            matchingWindows.push({
              grade: g,
              block: blk,
              overlap: ov
            });
          }
        });
      });

      const availCount = availableGradesSet.size;
      const headerTitle = `${occ.d} — Grade ${occ.g} · ${occ.b}${occ.m ? ` (${occ.m})` : ''} · ${formatMinutes(targetStart)}–${formatMinutes(targetEnd)} (${occ.duration} min)`;

      // Build plain-text summary for Copy Summary button
      const summaryLines = [
        headerTitle,
        `Availability: ${availCount} of 4 grades available (${state.minOverlap}+ min overlap)`,
        ...(matchingWindows.length
          ? matchingWindows.map(
              (m) =>
                `• Grade ${m.grade}: ${m.block.b}${m.block.m ? ` — ${m.block.m}` : ''} (${m.block.t}) — ${formatMinutes(m.overlap.start)}–${formatMinutes(m.overlap.end)} (${m.overlap.mins} min overlap)`
            )
          : ['• No matching overlapping windows for current filter settings.'])
      ];
      const summaryText = summaryLines.join('\n');

      // Target Grade Row
      const targetGradeBlocks = ENRICHED_SCHEDULE.filter((item) => item.g === occ.g && item.d === occ.d);
      const targetRowBlocksHtml = targetGradeBlocks
        .map((blk) => {
          const isCurrentTarget = blk === occ;
          const visualClass = isCurrentTarget
            ? 'is-target'
            : blk.m
              ? 'is-meeting'
              : 'is-other';
          return renderBlockSegment(blk, {
            visualClass,
            extraBadge: isCurrentTarget ? 'Target Block' : blk.t
          });
        })
        .join('');

      // Other 4 Grades Rows
      const otherRowsHtml = otherGrades
        .map((g) => {
          const gradeBlocks = ENRICHED_SCHEDULE.filter((item) => item.g === g && item.d === occ.d);
          const blocksHtml = gradeBlocks
            .map((blk) => {
              const ov = getOverlapWindow(targetStart, targetEnd, blk.startMin, blk.endMin);
              const isMatch = state.compareAgainst.has(blk.b) && ov && ov.mins >= state.minOverlap;
              const visualClass = blk.m
                ? 'is-meeting'
                : isMatch
                  ? blk.t === 'No Students'
                    ? 'is-match-no-students'
                    : 'is-match-with-students'
                  : 'is-other';
              return renderBlockSegment(blk, {
                visualClass,
                overlapInfo: isMatch ? ov : null
              });
            })
            .join('');

          return `
            <div class="grade-row">
              <div class="grade-label">Grade ${g}</div>
              <div class="track-lane">
                ${renderGridLines()}
                <div class="target-window-guide" style="left: ${guideLeft.toFixed(4)}%; width: ${guideWidth.toFixed(4)}%;"></div>
                ${blocksHtml}
              </div>
            </div>
          `;
        })
        .join('');

      // Compact Matching Window List
      const matchesListHtml = matchingWindows.length
        ? matchingWindows
            .map((m) => {
              const dotColor = m.block.t === 'No Students' ? 'var(--green-no-students)' : 'var(--slate-with-students)';
              return `
                <div class="match-chip${m.block.m ? ' has-meeting' : ''}">
                  <span class="match-chip-dot" style="background-color: ${dotColor};"></span>
                  <span>Grade ${m.grade} · ${escapeHtml(m.block.b)}</span>
                  ${m.block.m ? `<span class="match-chip-meeting">${escapeHtml(m.block.m)}</span>` : ''}
                  <span class="match-chip-meta">${formatMinutes(m.overlap.start)}–${formatMinutes(m.overlap.end)} (${m.overlap.mins} min)</span>
                </div>
              `;
            })
            .join('')
        : `<span class="no-matches-note">No overlapping blocks match the selected filters and ${state.minOverlap}+ min threshold.</span>`;

      return `
        <article class="card">
          <div class="result-card-header">
            <h2 class="result-title">${escapeHtml(headerTitle)}</h2>
            <div class="result-actions">
              <span class="avail-badge ${availCount === 0 ? 'zero' : ''}">${availCount} of 4 grades available</span>
              <button
                type="button"
                class="copy-btn"
                data-action="copy-summary"
                data-summary="${escapeHtml(summaryText)}"
              >
                Copy Summary
              </button>
            </div>
          </div>

          <div class="timeline-subheader">
            <span class="timeline-caption">SCHEDULE COMPARISON</span>
            <div class="legend-list">
              <span class="legend-item"><span class="legend-swatch" style="background: var(--navy-primary);"></span>Target Block</span>
              <span class="legend-item"><span class="legend-swatch" style="background: var(--green-no-students);"></span>HR without Students</span>
              <span class="legend-item"><span class="legend-swatch" style="background: var(--slate-with-students);"></span>HR with Students</span>
              <span class="legend-item"><span class="legend-swatch" style="background: var(--meeting-bg); border-color: var(--meeting-border);"></span>Team Meeting / Planning</span>
              <span class="legend-item"><span class="legend-swatch" style="background: var(--other-block);"></span>Other Block</span>
            </div>
          </div>

          <div class="timeline-scroll">
            <div class="timeline-board">
              ${renderTimelineAxis()}
              <div class="timeline-rows-wrap">
                <div class="grade-row target-row">
                  <div class="grade-label">
                    Grade ${occ.g}
                    <span class="role-tag">Target</span>
                  </div>
                  <div class="track-lane">
                    ${renderGridLines()}
                    ${targetRowBlocksHtml}
                  </div>
                </div>
                ${otherRowsHtml}
              </div>
            </div>
          </div>

          <div class="matches-summary">
            ${matchesListHtml}
          </div>
        </article>
      `;
    }

    /* ========================================================================
       6. MODE 2: BY DAY & TIME RENDERER
       ======================================================================== */
    function renderDayTimeMode() {
      const startMin = parseFlexibleTime(state.dtStartText);
      const endMin = parseFlexibleTime(state.dtEndText);
      let validationMsg = '';

      if (startMin === null || endMin === null) {
        validationMsg = 'Enter valid start and end times (e.g., 10:25 AM and 11:30 AM).';
      } else if (endMin <= startMin) {
        validationMsg = 'End time must be after start time.';
      } else if (startMin < DAY_START_MIN || endMin > DAY_END_MIN) {
        validationMsg = 'Time window must fall within the 7:30 AM – 2:45 PM school day.';
      }

      const filterCardHtml = `
        <section class="card" aria-label="Day and time filters">
          <div class="filter-grid">
            <!-- 1. DAY OF THE WEEK -->
            <div class="filter-section">
              <div class="section-label">1. DAY OF THE WEEK</div>
              <div class="pill-row">
                ${DAYS.map(
                  (day) => `
                    <button
                      type="button"
                      class="pill ${state.dtDay === day ? 'active' : ''}"
                      data-action="dt-select-day"
                      data-day="${day}"
                    >
                      ${day}
                    </button>
                  `
                ).join('')}
              </div>
            </div>

            <!-- 2. TIME WINDOW -->
            <div class="filter-section">
              <div class="section-label">2. TIME WINDOW</div>
              <div class="time-inputs-wrap">
                <div class="time-field">
                  <label for="dtStartInput">Start Time</label>
                  <input
                    id="dtStartInput"
                    type="text"
                    class="time-input"
                    value="${escapeHtml(state.dtStartText)}"
                    placeholder="10:25 AM"
                    data-action="dt-start-input"
                  />
                </div>
                <div class="time-field">
                  <label for="dtEndInput">End Time</label>
                  <input
                    id="dtEndInput"
                    type="text"
                    class="time-input"
                    value="${escapeHtml(state.dtEndText)}"
                    placeholder="11:30 AM"
                    data-action="dt-end-input"
                  />
                </div>
                ${validationMsg ? `<div class="time-error">${escapeHtml(validationMsg)}</div>` : ''}
              </div>
            </div>
          </div>
        </section>
      `;

      if (validationMsg) {
        return filterCardHtml;
      }

      const windowDuration = endMin - startMin;
      const guideLeft = ((startMin - DAY_START_MIN) / DAY_SPAN_MIN) * 100;
      const guideWidth = ((endMin - startMin) / DAY_SPAN_MIN) * 100;

      const matchingWindows = [];

      GRADES.forEach((g) => {
        const blocks = ENRICHED_SCHEDULE.filter((item) => item.g === g && item.d === state.dtDay);
        blocks.forEach((blk) => {
          const ov = getOverlapWindow(startMin, endMin, blk.startMin, blk.endMin);
          if (ov) {
            matchingWindows.push({
              grade: g,
              block: blk,
              overlap: ov
            });
          }
        });
      });

      const blockCount = matchingWindows.length;
      const headerTitle = `${state.dtDay} — ${formatMinutes(startMin)}–${formatMinutes(endMin)} (${windowDuration} min)`;

      const summaryLines = [headerTitle];
      GRADES.forEach((g) => {
        const gradeMatches = matchingWindows.filter((m) => m.grade === g);
        summaryLines.push(`Grade ${g}:`);
        if (gradeMatches.length) {
          gradeMatches.forEach((m) => {
            summaryLines.push(
              `  • ${m.block.b}${m.block.m ? ` — ${m.block.m}` : ''}: ${formatMinutes(m.overlap.start)} – ${formatMinutes(m.overlap.end)} · ${m.overlap.mins} min (${m.block.t})`
            );
          });
        } else {
          summaryLines.push('  • No scheduled blocks in this window.');
        }
      });
      const summaryText = summaryLines.join('\n');

      const allGradeRowsHtml = GRADES.map((g) => {
        const gradeBlocks = ENRICHED_SCHEDULE.filter((item) => item.g === g && item.d === state.dtDay);
        const blocksHtml = gradeBlocks
          .map((blk) => {
            const ov = getOverlapWindow(startMin, endMin, blk.startMin, blk.endMin);
            const isMatch = Boolean(ov);
            const visualClass = blk.m
              ? 'is-meeting'
              : isMatch
                ? blk.t === 'No Students'
                  ? 'is-match-no-students'
                  : 'is-match-with-students'
                : 'is-other';
            return renderBlockSegment(blk, {
              visualClass,
              overlapInfo: isMatch ? ov : null
            });
          })
          .join('');

        return `
          <div class="grade-row">
            <div class="grade-label">Grade ${g}</div>
            <div class="track-lane">
              ${renderGridLines()}
              <div class="target-window-guide" style="left: ${guideLeft.toFixed(4)}%; width: ${guideWidth.toFixed(4)}%;"></div>
              ${blocksHtml}
            </div>
          </div>
        `;
      }).join('');

      const gradeCardsHtml = GRADES.map((g) => {
        const gradeMatches = matchingWindows.filter((m) => m.grade === g);
        const hasMeeting = gradeMatches.some((m) => Boolean(m.block.m));
        const hasNoStudents = gradeMatches.some((m) => m.block.t === 'No Students');
        const hasWithStudents = gradeMatches.some((m) => m.block.t === 'With Students');
        const cardToneClass = hasMeeting
          ? 'has-meeting'
          : hasNoStudents
            ? 'has-no-students'
            : hasWithStudents
              ? 'has-with-students'
              : '';

        const itemsHtml = gradeMatches.length
          ? gradeMatches
              .map((m) => {
                const isNoStudents = m.block.t === 'No Students';
                const pillClass = isNoStudents ? 'no-students' : 'with-students';
                const pillLabel = isNoStudents ? 'HR without Students' : 'HR with Students';
                const fullBlockHint =
                  m.block.startMin !== m.overlap.start || m.block.endMin !== m.overlap.end
                    ? `Full block: ${formatMinutes(m.block.startMin)} – ${formatMinutes(m.block.endMin)}`
                    : '';
                return `
                  <div class="dt-grade-block-item" ${fullBlockHint ? `title="${escapeHtml(fullBlockHint)}"` : ''}>
                    <div class="dt-block-info">
                      <div class="dt-block-title">${escapeHtml(m.block.b)}</div>
                      ${m.block.m ? `<div class="dt-meeting-note">${escapeHtml(m.block.m)}</div>` : ''}
                      <div class="dt-block-meta">${formatMinutes(m.overlap.start)} – ${formatMinutes(m.overlap.end)} · ${m.overlap.mins} min</div>
                    </div>
                    <span class="dt-status-pill ${pillClass}">${pillLabel}</span>
                  </div>
                `;
              })
              .join('')
          : `<div class="no-matches-note">No scheduled blocks in this window.</div>`;

        return `
          <div class="dt-grade-card ${cardToneClass}">
            <div class="dt-grade-card-header">Grade ${g}</div>
            <div class="dt-grade-block-list">
              ${itemsHtml}
            </div>
          </div>
        `;
      }).join('');

      const resultCardHtml = `
        <article class="card">
          <div class="result-card-header">
            <h2 class="result-title">${escapeHtml(headerTitle)}</h2>
            <div class="result-actions">
              <span class="avail-badge ${blockCount === 0 ? 'zero' : ''}">${blockCount} overlapping block${blockCount === 1 ? '' : 's'}</span>
              <button
                type="button"
                class="copy-btn"
                data-action="copy-summary"
                data-summary="${escapeHtml(summaryText)}"
              >
                Copy Summary
              </button>
            </div>
          </div>

          <div class="timeline-subheader">
            <span class="timeline-caption">SCHEDULE COMPARISON</span>
            <div class="legend-list">
              <span class="legend-item"><span class="legend-swatch" style="background: rgba(153, 27, 27, 0.08); border: 2px dashed #991b1b;"></span>Selected Window</span>
              <span class="legend-item"><span class="legend-swatch" style="background: var(--green-no-students);"></span>HR without Students</span>
              <span class="legend-item"><span class="legend-swatch" style="background: var(--slate-with-students);"></span>HR with Students</span>
              <span class="legend-item"><span class="legend-swatch" style="background: var(--meeting-bg); border-color: var(--meeting-border);"></span>Team Meeting / Planning</span>
              <span class="legend-item"><span class="legend-swatch" style="background: var(--other-block);"></span>Other Block</span>
            </div>
          </div>

          <div class="timeline-scroll">
            <div class="timeline-board">
              ${renderTimelineAxis()}
              <div class="timeline-rows-wrap">
                ${allGradeRowsHtml}
              </div>
            </div>
          </div>

          <div class="dt-grade-grid">
            ${gradeCardsHtml}
          </div>
        </article>
      `;

      return `${filterCardHtml}${resultCardHtml}`;
    }

    /* ========================================================================
       6B. MODE 3: MASTER GRID RENDERER
       ======================================================================== */
    function renderMasterGridMode() {
      const daysToShow = state.gridDay === 'All' ? DAYS : [state.gridDay];

      const filterCardHtml = `
        <section class="card" aria-label="Master grid filters">
          <div class="filter-grid">
            <!-- 1. DAY OF THE WEEK -->
            <div class="filter-section">
              <div class="section-label">1. DAY OF THE WEEK</div>
              <div class="pill-row">
                <button
                  type="button"
                  class="pill ${state.gridDay === 'All' ? 'active' : ''}"
                  data-action="mg-select-day"
                  data-day="All"
                >
                  All Days (Mon–Fri)
                </button>
                ${DAYS.map(
                  (day) => `
                    <button
                      type="button"
                      class="pill ${state.gridDay === day ? 'active' : ''}"
                      data-action="mg-select-day"
                      data-day="${day}"
                    >
                      ${day}
                    </button>
                  `
                ).join('')}
              </div>
            </div>

            <!-- 2. HIGHLIGHT FILTER -->
            <div class="filter-section">
              <div class="section-label">2. HIGHLIGHT FILTER</div>
              <div class="pill-row">
                <button
                  type="button"
                  class="pill ${state.gridHighlight === 'all' ? 'active' : ''}"
                  data-action="mg-select-highlight"
                  data-highlight="all"
                >
                  All Blocks
                </button>
                <button
                  type="button"
                  class="pill compare-pill type-no-students ${state.gridHighlight === 'no-students' ? 'active' : ''}"
                  data-action="mg-select-highlight"
                  data-highlight="no-students"
                >
                  <span class="status-dot dot-no-students"></span>
                  <span>No Students Only</span>
                </button>
                <button
                  type="button"
                  class="pill compare-pill type-with-students ${state.gridHighlight === 'with-students' ? 'active' : ''}"
                  data-action="mg-select-highlight"
                  data-highlight="with-students"
                >
                  <span class="status-dot dot-with-students"></span>
                  <span>With Students Only</span>
                </button>
                <button
                  type="button"
                  class="pill ${state.gridHighlight === 'meetings' ? 'active' : ''}"
                  data-action="mg-select-highlight"
                  data-highlight="meetings"
                >
                  Team Meetings / Planning
                </button>
              </div>
            </div>
          </div>
        </section>
      `;

      const dayCardsHtml = daysToShow
        .map((day) => {
          const summaryLines = [`${day} — ES Master Schedule (Grades 1–5)`];

          const gradeRowsHtml = GRADES.map((g) => {
            const gradeBlocks = ENRICHED_SCHEDULE.filter((item) => item.g === g && item.d === day);
            summaryLines.push(
              `Grade ${g}: ` +
                gradeBlocks
                  .map(
                    (b) =>
                      `${b.b}${b.m ? ` [${b.m}]` : ''} (${formatShortTime(b.startMin)}–${formatShortTime(b.endMin)})`
                  )
                  .join(', ')
            );

            const blocksHtml = gradeBlocks
              .map((blk) => {
                let visualClass = 'is-other';
                if (state.gridHighlight === 'all') {
                  if (blk.m) {
                    visualClass = 'is-meeting';
                  } else if (blk.t === 'No Students') {
                    visualClass = 'is-grid-no-students';
                  } else if (blk.t === 'With Students') {
                    visualClass = 'is-grid-with-students';
                  }
                } else if (state.gridHighlight === 'no-students') {
                  visualClass = blk.m
                    ? 'is-meeting'
                    : blk.t === 'No Students'
                      ? 'is-grid-no-students'
                      : 'is-other';
                } else if (state.gridHighlight === 'with-students') {
                  visualClass = blk.t === 'With Students' ? 'is-grid-with-students' : 'is-other';
                } else if (state.gridHighlight === 'meetings') {
                  visualClass = blk.m ? 'is-meeting' : 'is-other';
                }

                return renderBlockSegment(blk, {
                  visualClass,
                  extraBadge: blk.m ? `${blk.t} · ${blk.m}` : blk.t
                });
              })
              .join('');

            return `
              <div class="grade-row">
                <div class="grade-label">Grade ${g}</div>
                <div class="track-lane">
                  ${renderGridLines()}
                  ${blocksHtml}
                </div>
              </div>
            `;
          }).join('');

          return `
            <article class="card">
              <div class="result-card-header">
                <h2 class="result-title">${day} — Master Schedule Grid (Grades 1–5)</h2>
                <div class="result-actions">
                  <button
                    type="button"
                    class="copy-btn"
                    data-action="copy-summary"
                    data-summary="${escapeHtml(summaryLines.join('\n'))}"
                  >
                    Copy ${day} Schedule
                  </button>
                </div>
              </div>

              <div class="timeline-subheader">
                <span class="timeline-caption">FULL SCHOOL DAY TIMELINE </span>
                <div class="legend-list">
                  <span class="legend-item"><span class="legend-swatch" style="background: var(--green-no-students);"></span>HR without Students</span>
                  <span class="legend-item"><span class="legend-swatch" style="background: var(--slate-with-students);"></span>HR with Students</span>
                  <span class="legend-item"><span class="legend-swatch" style="background: var(--meeting-bg); border-color: var(--meeting-border);"></span>Team Meeting / Planning</span>
                </div>
              </div>

              <div class="timeline-scroll">
                <div class="timeline-board">
                  ${renderTimelineAxis()}
                  <div class="timeline-rows-wrap">
                    ${gradeRowsHtml}
                  </div>
                </div>
              </div>
            </article>
          `;
        })
        .join('');

      return `${filterCardHtml}<div class="mg-day-stack">${dayCardsHtml}</div>`;
    }

    /* ========================================================================
       7. RENDER ORCHESTRATION & EVENT HANDLING
       ======================================================================== */
    function renderApp() {
      const root = document.getElementById('appRoot');
      if (state.mode === 'block') {
        root.innerHTML = renderBlockMode();
      } else if (state.mode === 'daytime') {
        root.innerHTML = renderDayTimeMode();
      } else {
        root.innerHTML = renderMasterGridMode();
      }
    }

    // Mode switcher tabs
    document.querySelectorAll('.mode-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const nextMode = btn.getAttribute('data-mode');
        if (!nextMode || nextMode === state.mode) return;
        state.mode = nextMode;
        document.querySelectorAll('.mode-btn').forEach((b) => {
          b.classList.toggle('active', b.getAttribute('data-mode') === state.mode);
        });
        renderApp();
      });
    });

    // Delegated click interactions inside #appRoot
    document.getElementById('appRoot').addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;

      const action = target.getAttribute('data-action');

      switch (action) {
        case 'select-grade': {
          state.selectedGrade = parseInt(target.getAttribute('data-grade'), 10);
          renderApp();
          break;
        }
        case 'select-target': {
          const subj = target.getAttribute('data-subject');
          if (state.targetBlocks.has(subj)) {
            state.targetBlocks.delete(subj);
          } else {
            state.targetBlocks.add(subj);
          }
          renderApp();
          break;
        }
        case 'target-unselect-all': {
          state.targetBlocks = new Set();
          renderApp();
          break;
        }
        case 'select-all-days': {
          state.selectedDays = new Set(DAYS);
          renderApp();
          break;
        }
        case 'toggle-day': {
          const day = target.getAttribute('data-day');
          if (state.selectedDays.has(day)) {
            if (state.selectedDays.size > 1) {
              state.selectedDays.delete(day);
            }
          } else {
            state.selectedDays.add(day);
          }
          renderApp();
          break;
        }
        case 'only-day': {
          e.stopPropagation();
          const day = target.getAttribute('data-day');
          state.selectedDays = new Set([day]);
          renderApp();
          break;
        }
        case 'toggle-compare': {
          const item = target.getAttribute('data-compare');
          if (state.compareAgainst.has(item)) {
            state.compareAgainst.delete(item);
          } else {
            state.compareAgainst.add(item);
          }
          renderApp();
          break;
        }
        case 'preset-compare': {
          const preset = target.getAttribute('data-preset');
          if (preset === 'no-students') {
            state.compareAgainst = new Set(NO_STUDENTS_SET);
          } else if (preset === 'with-students') {
            state.compareAgainst = new Set(WITH_STUDENTS_SET);
          } else if (preset === 'unselect-all') {
            state.compareAgainst = new Set();
          }
          renderApp();
          break;
        }
        case 'select-overlap': {
          state.minOverlap = parseInt(target.getAttribute('data-overlap'), 10);
          renderApp();
          break;
        }
        case 'copy-summary': {
          const summary = target.getAttribute('data-summary') || '';
          copyTextToClipboard(summary, target);
          break;
        }

        // Mode 2 actions
        case 'dt-select-day': {
          state.dtDay = target.getAttribute('data-day');
          renderApp();
          break;
        }

        // Mode 3 actions
        case 'mg-select-day': {
          state.gridDay = target.getAttribute('data-day');
          renderApp();
          break;
        }
        case 'mg-select-highlight': {
          state.gridHighlight = target.getAttribute('data-highlight');
          renderApp();
          break;
        }

      }
    });

    // Live manual time inputs for Mode 2 (preserving input cursor focus)
    // Automatically populates End Time 1 hour after valid Start Time (capped at 2:45 PM)
    document.getElementById('appRoot').addEventListener('input', (e) => {
      const target = e.target;
      if (!target || !target.getAttribute) return;
      const action = target.getAttribute('data-action');
      if (action === 'dt-start-input' || action === 'dt-end-input') {
        const cursorPos = target.selectionStart;
        if (action === 'dt-start-input') {
          state.dtStartText = target.value;
          const parsedStart = parseFlexibleTime(target.value);
          if (parsedStart !== null && parsedStart >= DAY_START_MIN && parsedStart < DAY_END_MIN) {
            const autoEndMin = Math.min(parsedStart + 60, DAY_END_MIN);
            state.dtEndText = formatMinutes(autoEndMin);
          }
        } else {
          state.dtEndText = target.value;
        }
        renderApp();
        const restored = document.getElementById(target.id);
        if (restored) {
          restored.focus();
          restored.setSelectionRange(cursorPos, cursorPos);
        }
      }
    });

    // Keyboard accessibility for day pills
    document.getElementById('appRoot').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        const dayPill = e.target.closest('.day-pill');
        if (dayPill && e.target === dayPill) {
          e.preventDefault();
          dayPill.click();
        }
      }
    });

    // Hover Tooltip Handler
    const tooltipEl = document.getElementById('tooltip');

    document.addEventListener('mouseover', (e) => {
      const blockEl = e.target.closest('.sched-block');
      if (!blockEl) {
        tooltipEl.classList.remove('visible');
        return;
      }
      const title = blockEl.getAttribute('data-tt-title') || '';
      const sub = blockEl.getAttribute('data-tt-sub') || '';
      const badge = blockEl.getAttribute('data-tt-badge') || '';

      tooltipEl.innerHTML = `
        <div class="tooltip-title">${escapeHtml(title)}</div>
        <div class="tooltip-sub">${escapeHtml(sub)}</div>
        <div class="tooltip-badge">${escapeHtml(badge)}</div>
      `;
      tooltipEl.classList.add('visible');
    });

    document.addEventListener('mousemove', (e) => {
      if (!tooltipEl.classList.contains('visible')) return;
      const pad = 14;
      const rect = tooltipEl.getBoundingClientRect();
      let left = e.clientX + pad;
      let top = e.clientY + pad;

      if (left + rect.width > window.innerWidth - 10) {
        left = e.clientX - rect.width - pad;
      }
      if (top + rect.height > window.innerHeight - 10) {
        top = e.clientY - rect.height - pad;
      }

      tooltipEl.style.left = `${Math.max(8, left)}px`;
      tooltipEl.style.top = `${Math.max(8, top)}px`;
    });

    document.addEventListener('mouseout', (e) => {
      if (!e.relatedTarget || !e.relatedTarget.closest('.sched-block')) {
        tooltipEl.classList.remove('visible');
      }
    });

    // Initial render
    renderApp();
  </script>
</body>
</html>
