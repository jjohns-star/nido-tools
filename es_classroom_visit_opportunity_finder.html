<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ES Classroom Visit Opportunity Finder — International School Nido de Aguilas</title>
  <!-- Load Google Font Raleway (weights 600, 700, 800) for headings -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       DESIGN TOKENS & PALETTE
       ========================================================================== */
    :root {
      --font-head: 'Raleway', sans-serif;
      --font-body: 'Avenir Next', 'Avenir', 'Nunito Sans', -apple-system, BlinkMacSystemFont, sans-serif;

      --bg-page: #fcfaf8;
      --bg-surface: #ffffff;
      --border-hairline: #e3d9ce;
      --border-soft: #e6ddd3;

      --track-tab: #f1e9e0;
      --pill-bg: #f5f1ec;
      --pill-hover: #ece5dc;

      --navy-primary: #202a3c;
      --green-no-students: #006f4f;
      --slate-with-students: #205176;
      --other-block: #f2ede4;

      /* Pale yellow tokens for Grade-Level Team Meetings */
      --team-meeting-bg: #fef3c7;
      --team-meeting-border: #e6c656;
      --team-meeting-text: #4a3505;
      --team-meeting-pill-bg: #fef7d6;

      --text-main: #202a3c;
      --text-muted: #5d6574;
      --text-subtle: #7c828e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ==========================================================================
       TOP HEADER & BRAND LOCKUP
       ========================================================================== */
    .app-header {
      background-color: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-inner {
      max-width: 1320px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .brand-logo {
      height: 52px;
      width: auto;
      display: block;
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.32rem;
      color: var(--navy-primary);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .brand-text p {
      font-family: var(--font-body);
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Segmented Mode Switcher */
    .mode-switcher {
      background-color: var(--track-tab);
      padding: 4px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border-hairline);
      flex-wrap: wrap;
    }

    .mode-btn {
      font-family: var(--font-body);
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--navy-primary);
      background: transparent;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
      white-space: nowrap;
    }

    .mode-btn:hover:not(.active) {
      background-color: rgba(255, 255, 255, 0.55);
    }

    .mode-btn.active {
      background-color: var(--navy-primary);
      color: #ffffff;
      box-shadow: 0 1px 3px rgba(32, 42, 60, 0.18);
    }

    /* ==========================================================================
       MAIN CONTAINER & CARDS
       ========================================================================== */
    .main-container {
      max-width: 1320px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: 0 1px 3px rgba(32, 42, 60, 0.03);
    }

    /* Filter Sections */
    .filter-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .filter-section + .filter-section {
      padding-top: 16px;
      border-top: 1px solid var(--border-soft);
    }

    .section-label {
      font-family: var(--font-head);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    /* Standard Filter Pills */
    .pill {
      font-family: var(--font-body);
      font-size: 0.86rem;
      font-weight: 600;
      background-color: var(--pill-bg);
      color: var(--navy-primary);
      border: 1px solid var(--border-hairline);
      border-radius: 999px;
      padding: 7px 15px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .pill:hover:not(.active) {
      background-color: var(--pill-hover);
    }

    .pill.active {
      background-color: var(--navy-primary);
      color: #ffffff;
      border-color: var(--navy-primary);
    }

    /* Day Pill with inline 'only' trigger */
    .day-pill {
      padding-right: 8px;
    }

    .only-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: lowercase;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(32, 42, 60, 0.18);
      background-color: rgba(255, 255, 255, 0.7);
      color: var(--navy-primary);
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .day-pill.active .only-btn {
      background-color: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }

    .only-btn:hover {
      background-color: #ffffff;
      color: var(--navy-primary);
    }

    /* Compare Against Pills with Status Dot */
    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-no-students {
      background-color: var(--green-no-students);
    }

    .dot-with-students {
      background-color: var(--slate-with-students);
    }

    .pill.compare-pill.active.type-no-students {
      background-color: var(--green-no-students);
      border-color: var(--green-no-students);
      color: #ffffff;
    }

    .pill.compare-pill.active.type-with-students {
      background-color: var(--slate-with-students);
      border-color: var(--slate-with-students);
      color: #ffffff;
    }

    .pill.compare-pill.active .status-dot {
      background-color: #ffffff;
    }

    /* Quick Presets Row */
    .presets-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .presets-label {
      font-family: var(--font-head);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
      margin-right: 2px;
    }

    .preset-btn {
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-hairline);
      background-color: var(--bg-surface);
      color: var(--navy-primary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.14s ease, border-color 0.14s ease;
    }

    .preset-btn:hover {
      background-color: var(--pill-bg);
      border-color: #cfc2b4;
    }

    /* Manual Time Inputs (Mode 2) */
    .time-inputs-wrap {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .time-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .time-field label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .time-input {
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--navy-primary);
      background-color: var(--pill-bg);
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
      padding: 8px 13px;
      width: 145px;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .time-input:focus {
      background-color: #ffffff;
      border-color: var(--navy-primary);
    }

    .time-error {
      font-size: 0.82rem;
      font-weight: 600;
      color: #b42318;
      background-color: #fef3f2;
      border: 1px solid #fecdca;
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* ==========================================================================
       RESULTS & TIMELINE VISUALIZATION
       ========================================================================== */
    .results-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .result-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-soft);
    }

    .result-title {
      font-family: var(--font-head);
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--navy-primary);
    }

    .result-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .avail-badge {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background-color: #e7f4ef;
      color: var(--green-no-students);
      border: 1px solid rgba(0, 111, 79, 0.2);
    }

    .avail-badge.zero {
      background-color: var(--pill-bg);
      color: var(--text-muted);
      border-color: var(--border-hairline);
    }

    .copy-btn {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      background-color: var(--bg-surface);
      color: var(--navy-primary);
      border: 1px solid var(--border-hairline);
      border-radius: 9px;
      padding: 6px 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .copy-btn:hover {
      background-color: var(--pill-bg);
      border-color: #cfc2b4;
    }

    .copy-btn.copied {
      background-color: var(--navy-primary);
      color: #ffffff;
      border-color: var(--navy-primary);
    }

    /* Timeline Subheader & Legend */
    .timeline-subheader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      margin-bottom: 10px;
    }

    .timeline-caption {
      font-family: var(--font-head);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .legend-list {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 4px;
      border: 1px solid rgba(32, 42, 60, 0.14);
      flex-shrink: 0;
    }

    /* Horizontal Scroll Container for Responsive Safety */
    .timeline-scroll {
      width: 100%;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .timeline-board {
      min-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Axis Header */
    .timeline-axis-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: end;
      gap: 12px;
      padding-bottom: 4px;
    }

    .axis-track {
      position: relative;
      height: 20px;
    }

    .axis-tick {
      position: absolute;
      transform: translateX(-50%);
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-subtle);
      white-space: nowrap;
    }

    .axis-tick:first-child {
      transform: translateX(0);
    }

    .axis-tick:last-child {
      transform: translateX(-100%);
    }

    /* Grade Track Rows */
    .timeline-rows-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .grade-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      gap: 12px;
    }

    .grade-row.target-row {
      padding-bottom: 7px;
      margin-bottom: 2px;
      border-bottom: 1px dashed var(--border-hairline);
    }

    .grade-label {
      font-family: var(--font-head);
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy-primary);
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .grade-label span.role-tag {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-subtle);
      margin-top: 2px;
    }

    .track-lane {
      position: relative;
      height: 44px;
      background-color: #faf7f3;
      border: 1px solid var(--border-soft);
      border-radius: 9px;
      overflow: hidden;
    }

    /* Subtle Vertical Grid Lines & Target Highlight Window */
    .grid-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background-color: rgba(227, 217, 206, 0.55);
      pointer-events: none;
      z-index: 1;
    }

    .target-window-guide {
      position: absolute;
      top: 0;
      bottom: 0;
      background-color: rgba(32, 42, 60, 0.055);
      border-left: 1.5px dashed rgba(32, 42, 60, 0.32);
      border-right: 1.5px dashed rgba(32, 42, 60, 0.32);
      pointer-events: none;
      z-index: 2;
    }

    /* Individual Schedule Block Segments */
    .sched-block {
      position: absolute;
      top: 3px;
      bottom: 3px;
      border-radius: 6px;
      padding: 2px 5px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      z-index: 3;
      cursor: default;
      transition: filter 0.12s ease, transform 0.12s ease;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .sched-block:hover {
      filter: brightness(0.96);
      z-index: 5;
    }

    .sched-block.is-target {
      background-color: var(--navy-primary);
      color: #ffffff;
      border-color: var(--navy-primary);
    }

    .sched-block.is-match-no-students {
      background-color: var(--green-no-students);
      color: #ffffff;
      border-color: var(--green-no-students);
    }

    .sched-block.is-match-with-students {
      background-color: var(--slate-with-students);
      color: #ffffff;
      border-color: var(--slate-with-students);
    }

    /* Pale yellow styling for Team Meeting: Nuts & Bolts and Collaborative Planning */
    .sched-block.is-team-meeting {
      background-color: var(--team-meeting-bg);
      color: var(--team-meeting-text);
      border-color: var(--team-meeting-border);
    }

    .sched-block.is-team-meeting.is-matched-meeting {
      box-shadow: inset 0 0 0 1px rgba(180, 120, 12, 0.35);
    }

    .sched-block.is-other {
      background-color: var(--other-block);
      color: #4f5765;
      border-color: #e3dbd0;
    }

    .block-name {
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }

    .block-time {
      font-size: 0.63rem;
      font-weight: 600;
      opacity: 0.88;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
      margin-top: 1px;
    }

    /* Compact Matching Windows Summary List */
    .matches-summary {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .match-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background-color: var(--pill-bg);
      border: 1px solid var(--border-hairline);
      color: var(--navy-primary);
    }

    .match-chip.is-meeting-chip {
      background-color: var(--team-meeting-pill-bg);
      border-color: var(--team-meeting-border);
    }

    .match-chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .match-chip-meta {
      color: var(--text-muted);
      font-weight: 500;
    }

    .no-matches-note {
      font-size: 0.84rem;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Day & Time Mode: Per-Grade Breakdown Boxes */
    .dt-grade-grid {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--border-soft);
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .dt-grade-card {
      background-color: var(--bg-surface);
      border: 1.25px solid var(--border-hairline);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
    }

    .dt-grade-card.has-no-students {
      border-color: rgba(0, 111, 79, 0.34);
    }

    .dt-grade-card.has-with-students {
      border-color: rgba(32, 81, 118, 0.34);
    }

    .dt-grade-card-header {
      font-family: var(--font-head);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--navy-primary);
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-soft);
    }

    .dt-grade-block-list {
      display: flex;
      flex-direction: column;
    }

    .dt-grade-block-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .dt-grade-block-item + .dt-grade-block-item {
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px solid var(--border-soft);
    }

    .dt-block-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .dt-block-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--navy-primary);
      line-height: 1.25;
    }

    .dt-meeting-tag {
      display: inline-block;
      align-self: flex-start;
      margin-top: 2px;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      background-color: var(--team-meeting-bg);
      color: var(--team-meeting-text);
      border: 1px solid var(--team-meeting-border);
    }

    .dt-block-meta {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .dt-status-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .dt-status-pill.no-students {
      background-color: #e7f4ef;
      color: var(--green-no-students);
    }

    .dt-status-pill.with-students {
      background-color: #e8eff5;
      color: var(--slate-with-students);
    }

    @media (max-width: 980px) {
      .dt-grade-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .dt-grade-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ==========================================================================
       FLOATING TOOLTIP & TOAST
       ========================================================================== */
    .floating-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 100;
      background-color: var(--navy-primary);
      color: #ffffff;
      padding: 10px 13px;
      border-radius: 10px;
      font-size: 0.8rem;
      line-height: 1.4;
      box-shadow: 0 8px 22px rgba(32, 42, 60, 0.25);
      max-width: 290px;
      opacity: 0;
      transition: opacity 0.1s ease;
    }

    .floating-tooltip.visible {
      opacity: 1;
    }

    .tooltip-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 2px;
    }

    .tooltip-sub {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.77rem;
    }

    .tooltip-badge {
      display: inline-block;
      margin-top: 5px;
      padding: 2px 7px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 700;
      background-color: rgba(255, 255, 255, 0.16);
    }

    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--navy-primary);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
